<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomotheon</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <!-- App Header -->
      <header class="app-header">
        <div class="brand">
          <div class="brand-icon">P</div>
          <span class="brand-title">POMOTHEON</span>
        </div>

        <!-- Icon-only navigation between Pantheon and Timer -->
        <nav class="nav-tabs" aria-label="Main Navigation">
          <button
            class="nav-tab-icon active"
            data-tab="pantheon"
            id="tab-btn-pantheon"
            aria-label="Pantheon"
            title="Pantheon"
          >
            <!-- Pantheon Columns SVG Icon -->
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 21h18M4 18h16M6 18V9M10 18V9M14 18V9M18 18V9M2 9l10-6 10 6" />
            </svg>
          </button>
          <button
            class="nav-tab-icon"
            data-tab="timer"
            id="tab-btn-timer"
            aria-label="Pomodoro Timer"
            title="Pomodoro Timer"
          >
            <!-- Timer Clock SVG Icon -->
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="13" r="8" />
              <path d="M12 9v4l2.5 2.5M10 2h4M12 2v3" />
            </svg>
          </button>
        </nav>

        <div class="header-right">
          <!-- Credit Balance Display -->
          <div class="balance-chip" id="global-balance-chip" aria-label="Points Balance" title="Credit Points Balance">
            <span class="symbol">✦</span>
            <span class="amount" id="global-balance-val">0</span>
          </div>

          <!-- Small Gear Icon next to Balance -->
          <button
            class="icon-btn"
            id="btn-open-settings"
            aria-label="Settings"
            title="Settings"
          >
            <!-- Settings Gear SVG Icon -->
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Main Viewport -->
      <main class="main-viewport">
        <!-- 1. Pantheon Screen (Horizontal Playing-Card Snap Strip) -->
        <section class="view-panel active" id="panel-pantheon">
          <div class="strip-container" id="pantheon-strip" tabindex="0" aria-label="Pantheon Playing Cards">
            <!-- Cards and the final Add Card rendered dynamically -->
          </div>
        </section>

        <!-- 2. Pomodoro Timer Screen -->
        <section class="view-panel" id="panel-timer">
          <div class="timer-box">
            <!-- Mode Selector Icons -->
            <div class="timer-modes" role="group" aria-label="Session Mode">
              <button
                class="timer-mode-icon-btn active mode-focus"
                id="timer-btn-focus"
                data-mode="focus"
                aria-label="Focus Session"
                title="Focus Session"
              >
                <!-- Focus Target SVG Icon -->
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10" />
                  <circle cx="12" cy="12" r="6" />
                  <circle cx="12" cy="12" r="2" />
                </svg>
              </button>
              <button
                class="timer-mode-icon-btn mode-short-break"
                id="timer-btn-short-break"
                data-mode="short_break"
                aria-label="Short Break"
                title="Short Break"
              >
                <!-- Coffee Cup SVG Icon -->
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3" />
                </svg>
              </button>
              <button
                class="timer-mode-icon-btn mode-long-break"
                id="timer-btn-long-break"
                data-mode="long_break"
                aria-label="Long Break"
                title="Long Break"
              >
                <!-- Moon SVG Icon -->
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
              </button>
            </div>

            <div class="timer-card focus-active" id="timer-card">
              <div class="timer-countdown" id="timer-countdown">25:00</div>
              <div class="timer-cycle" id="timer-cycle-info">1 / 4</div>

              <div class="progress-track">
                <div class="progress-fill mode-focus" id="timer-progress-fill"></div>
              </div>

              <!-- Icon-only Timer Controls -->
              <div class="timer-actions">
                <button
                  class="action-icon-btn primary"
                  id="timer-btn-toggle"
                  aria-label="Start / Pause"
                  title="Start / Pause"
                >
                  <svg id="timer-play-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                    <polygon points="6 4 20 12 6 20 6 4" />
                  </svg>
                  <svg id="timer-pause-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display: none;">
                    <rect x="6" y="4" width="4" height="16" />
                    <rect x="14" y="4" width="4" height="16" />
                  </svg>
                </button>
                <button
                  class="action-icon-btn secondary"
                  id="timer-btn-reset"
                  aria-label="Reset Session"
                  title="Reset"
                >
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                  </svg>
                </button>
                <button
                  class="action-icon-btn secondary"
                  id="timer-btn-skip"
                  aria-label="Skip to Next"
                  title="Skip"
                >
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <polygon points="5 4 15 12 5 20 5 4" />
                    <line x1="19" y1="4" x2="19" y2="20" stroke="currentColor" stroke-width="2" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="timer-reward-badge" id="timer-reward-points">+25</div>
          </div>
        </section>
      </main>

      <!-- ==========================================================================
           5. Person Popup (Detail & Icon Actions)
           ========================================================================== -->
      <div class="modal-overlay" id="modal-person-popup" role="dialog" aria-modal="true" aria-label="Person Details">
        <div class="modal-card">
          <div class="modal-header">
            <span class="modal-title-text" id="popup-header-title"></span>
            <div style="display: flex; gap: 6px; align-items: center;">
              <!-- Edit Icon Button -->
              <button class="icon-btn" id="popup-btn-edit" aria-label="Edit Person" title="Edit">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                </svg>
              </button>
              <!-- Delete Icon Button -->
              <button class="icon-btn" id="popup-btn-delete" aria-label="Delete Person" title="Delete">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6" />
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                </svg>
              </button>
              <!-- Close Icon Button -->
              <button class="icon-btn" id="popup-btn-close" aria-label="Close" title="Close">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="18" y1="6" x2="6" y2="18" />
                  <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
              </button>
            </div>
          </div>
          <div class="modal-body">
            <div class="popup-header-box">
              <div class="popup-avatar" id="popup-avatar"></div>
              <div class="popup-meta">
                <div class="popup-name" id="popup-name"></div>
                <div class="popup-title" id="popup-title"></div>
              </div>
            </div>

            <div class="popup-quote-block" id="popup-quote-block" style="display: none;">
              <span id="popup-quote"></span>
            </div>

            <!-- Markdown Detail Container -->
            <div class="markdown-body" id="popup-markdown-content" style="display: none;"></div>

            <div class="popup-stats">
              <span id="popup-respects-count" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-weight: 700; color: var(--accent-gold);">0</span>
              <!-- Icon-only Pay Respect Button -->
              <button
                class="icon-btn"
                id="popup-btn-pay-respect"
                aria-label="Pay Respect"
                title="Pay Respect"
                style="color: var(--accent-gold); border-color: var(--accent-gold);"
              >
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ==========================================================================
           Add / Edit Person Form Modal
           ========================================================================== -->
      <div class="modal-overlay" id="modal-form" role="dialog" aria-modal="true" aria-label="Person Form">
        <div class="modal-card">
          <div class="modal-header">
            <span class="modal-title-text" id="form-modal-title"></span>
            <button class="icon-btn" id="form-btn-close" aria-label="Close" title="Close">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
          <form id="person-form">
            <div class="modal-body">
              <input type="hidden" id="form-person-id" value="" />

              <!-- Avatar Image -->
              <div class="form-field">
                <label class="field-label">Image</label>
                <div class="form-image-row">
                  <div class="form-image-preview" id="form-image-preview"></div>
                  <div style="display: flex; gap: 8px;">
                    <input
                      type="file"
                      id="form-file-input"
                      accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"
                      style="display: none;"
                    />
                    <button type="button" class="icon-btn" id="form-btn-browse-image" aria-label="Browse Image" title="Browse Image">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                      </svg>
                    </button>
                    <button type="button" class="icon-btn" id="form-btn-remove-image" aria-label="Remove Image" title="Remove Image" style="display: none;">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                      </svg>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Name -->
              <div class="form-field">
                <label class="field-label" for="form-name">Name</label>
                <input type="text" id="form-name" class="field-input" required />
                <div class="field-error" id="form-name-error" style="display: none;"></div>
              </div>

              <!-- Title -->
              <div class="form-field">
                <label class="field-label" for="form-title">Title</label>
                <input type="text" id="form-title" class="field-input" />
              </div>

              <!-- Quote -->
              <div class="form-field">
                <label class="field-label" for="form-quote">Quote</label>
                <input type="text" id="form-quote" class="field-input" />
              </div>

              <!-- Detail (Markdown) -->
              <div class="form-field">
                <label class="field-label" for="form-detail">Detail (Markdown)</label>
                <textarea id="form-detail" class="field-textarea" rows="6"></textarea>
              </div>
            </div>

            <!-- Icon-only Form Actions -->
            <div class="modal-footer">
              <button type="button" class="icon-btn" id="form-btn-cancel" aria-label="Cancel" title="Cancel">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="18" y1="6" x2="6" y2="18" />
                  <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
              </button>
              <button type="submit" class="icon-btn" id="form-btn-save" aria-label="Save" title="Save" style="color: var(--accent-gold);">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- ==========================================================================
           Settings Modal
           ========================================================================== -->
      <div class="modal-overlay" id="modal-settings" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="modal-card">
          <div class="modal-header">
            <span class="modal-title-text">Settings</span>
            <button class="icon-btn" id="settings-btn-close" aria-label="Close" title="Close">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
          <form id="settings-form">
            <div class="modal-body">
              <!-- Theme Option -->
              <div class="form-field">
                <label class="field-label" for="setting-theme">Theme</label>
                <select id="setting-theme" class="field-select">
                  <option value="system">System Default</option>
                  <option value="dark">Dark</option>
                  <option value="light">Light</option>
                </select>
              </div>

              <!-- Durations -->
              <div class="form-field">
                <label class="field-label" for="setting-focus-duration">Focus (min)</label>
                <input type="number" id="setting-focus-duration" class="field-input" min="1" max="180" required />
              </div>
              <div class="form-field">
                <label class="field-label" for="setting-short-break-duration">Short Break (min)</label>
                <input type="number" id="setting-short-break-duration" class="field-input" min="1" max="60" required />
              </div>
              <div class="form-field">
                <label class="field-label" for="setting-long-break-duration">Long Break (min)</label>
                <input type="number" id="setting-long-break-duration" class="field-input" min="1" max="120" required />
              </div>
              <div class="form-field">
                <label class="field-label" for="setting-sessions-cycle">Cycle Length</label>
                <input type="number" id="setting-sessions-cycle" class="field-input" min="1" max="12" required />
              </div>
              <div class="form-field">
                <label class="field-label" for="setting-points-per-minute">Points / Min</label>
                <input type="number" id="setting-points-per-minute" class="field-input" min="1" max="100" required />
              </div>
              <div class="form-field">
                <label class="field-label" for="setting-respect-cost">Respect Cost</label>
                <input type="number" id="setting-respect-cost" class="field-input" min="1" max="1000" required />
              </div>
            </div>

            <!-- Icon-only Settings Actions -->
            <div class="modal-footer">
              <button type="button" class="icon-btn" id="settings-btn-reset" aria-label="Reset Defaults" title="Reset Defaults">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                </svg>
              </button>
              <button type="submit" class="icon-btn" id="settings-btn-save" aria-label="Save Settings" title="Save" style="color: var(--accent-gold);">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Toast Container -->
      <div class="toast-container" id="toast-container"></div>
    </div>
  </body>
</html>
